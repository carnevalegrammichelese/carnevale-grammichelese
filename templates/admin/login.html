<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso — Dashboard Carnevale</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h2>Accesso amministratore</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for categoria, msg in messages %}
          <div class="flash errore">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="admin-form-row">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="admin-form-row">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-admin" style="width:100%;">Accedi</button>
    </form>
    <p style="font-size:0.78rem; color:#7a6f58; margin-top:16px; text-align:center;">
      Al primo accesso: admin / carnevale2027 — cambiala subito dopo.
    </p>
  </div>
</div>
</body>
</html>
