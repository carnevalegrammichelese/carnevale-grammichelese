{% extends "admin/base_admin.html" %}
{% block title %}Cambia password{% endblock %}
{% block content %}
<h1>Cambia password</h1>
<p class="admin-sub">Usa una password di almeno 8 caratteri, diversa da quella di default.</p>

<div class="admin-form-card" style="max-width:440px;">
  <form method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="admin-form-row">
      <label>Password attuale</label>
      <input type="password" name="attuale" required>
    </div>
    <div class="admin-form-row">
      <label>Nuova password</label>
      <input type="password" name="nuova" required minlength="8">
    </div>
    <div class="admin-form-row">
      <label>Conferma nuova password</label>
      <input type="password" name="conferma" required minlength="8">
    </div>
    <button type="submit" class="btn-admin">Aggiorna password</button>
  </form>
</div>
{% endblock %}
