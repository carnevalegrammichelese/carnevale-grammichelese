{% extends "base.html" %}
{% block title %}Crea il tuo account{% endblock %}
{% block content %}
<div class="wrap" style="max-width:520px; padding-top:60px; padding-bottom:80px;">
  <div class="form-card">
    <h3>Crea il tuo account</h3>
    <p style="color:#7a6f58; font-size:0.88rem; margin-bottom:20px;">
      Ti serve per iscrivere il tuo gruppo e gestire i partecipanti quando vuoi.
    </p>
    <form method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label>Nome e cognome <span class="req">*</span></label>
        <input type="text" name="nome" value="{{ form.get('nome','') }}" required>
      </div>
      <div class="form-row">
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" value="{{ form.get('email','') }}" required>
      </div>
      <div class="form-row">
        <label>Telefono</label>
        <input type="tel" name="telefono" value="{{ form.get('telefono','') }}">
      </div>
      <div class="form-row">
        <label>Password <span class="req">*</span></label>
        <input type="password" name="password" required minlength="8">
        <div class="form-hint">Almeno 8 caratteri.</div>
      </div>
      <div class="form-row">
        <label>Conferma password <span class="req">*</span></label>
        <input type="password" name="conferma" required minlength="8">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Crea account</button>
    </form>
    <p style="text-align:center; margin-top:18px; font-size:0.9rem;">
      Hai già un account? <a href="{{ url_for('accedi', next=next) }}" style="color:var(--rosso); font-weight:600;">Accedi</a>
    </p>
  </div>
</div>
{% endblock %}
