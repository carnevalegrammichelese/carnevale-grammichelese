{% extends "base.html" %}
{% block title %}Reimposta password{% endblock %}
{% block content %}
<div class="wrap" style="max-width:460px; padding-top:60px; padding-bottom:80px;">
  <div class="form-card">
    <h3>Scegli una nuova password</h3>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label>Nuova password <span class="req">*</span></label>
        <input type="password" name="nuova" required minlength="8">
        <div class="form-hint">Almeno 8 caratteri.</div>
      </div>
      <div class="form-row">
        <label>Conferma nuova password <span class="req">*</span></label>
        <input type="password" name="conferma" required minlength="8">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Salva la nuova password</button>
    </form>
  </div>
</div>
{% endblock %}
