{% extends "base.html" %}
{% block title %}Password dimenticata{% endblock %}
{% block content %}
<div class="wrap" style="max-width:460px; padding-top:60px; padding-bottom:80px;">
  <div class="form-card">
    <h3>Password dimenticata?</h3>
    <p style="color:#7a6f58; font-size:0.9rem; margin-bottom:20px;">
      Inserisci l'email con cui ti sei registrato/a: se l'account esiste, ti manderemo
      le istruzioni per sceglierne una nuova.
    </p>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Invia le istruzioni</button>
    </form>
    <p style="text-align:center; margin-top:18px; font-size:0.9rem;">
      <a href="{{ url_for('accedi') }}" style="color:var(--rosso); font-weight:600;">Torna al login</a>
    </p>
  </div>
</div>
{% endblock %}
